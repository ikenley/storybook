version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/story-generator"
      - "/front-end"
    schedule:
      interval: "weekly"

  # npm is split per-directory so each can carry its own ignore rules.
  - package-ecosystem: "npm"
    directory: "/story-generator"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript majors must be upgraded in lockstep with the toolchain.
      # TS 7 is outside the peer range of ts-jest 29.x (<7), which makes
      # `npm i` unresolvable. Remove once ts-jest v30 supports TS 7, or once
      # the test runner migration drops ts-jest entirely.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/front-end"
    schedule:
      interval: "weekly"
    ignore:
      # @astrojs/check 0.9.x peers on typescript ^5 || ^6, so a TS 7 bump
      # makes `npm i` unresolvable. Remove once @astrojs/check supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
