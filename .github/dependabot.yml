version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/story-generator"
      - "/front-end"
    schedule:
      interval: "weekly"

  # npm is split per-directory so each can carry its own ignore rules.
  # No ignore rules: since the toolchain moved to Biome and Vitest, nothing
  # in this package declares a TypeScript peer range, so majors resolve freely.
  - package-ecosystem: "npm"
    directory: "/story-generator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/front-end"
    schedule:
      interval: "weekly"
    ignore:
      # @astrojs/check 0.9.x peers on typescript ^5 || ^6, so a TS 7 bump
      # makes `npm i` unresolvable. Remove once @astrojs/check supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
